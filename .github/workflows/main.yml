name: Build iOS Project
on: [push, workflow_dispatch]

# Cette section force l'utilisation de Node 24 pour supprimer l'avertissement
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Create iOS App
        run: briefcase create ios --no-input

      - name: Build iOS App
        run: briefcase build ios --no-input

      - name: Upload Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: FlashTimer-Xcode
          path: build/flashtimer/ios/xcode/
